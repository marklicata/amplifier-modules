[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts =
    --verbose
    --cov=scripts
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
