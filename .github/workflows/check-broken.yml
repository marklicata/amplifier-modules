# Scheduled workflow to check module compatibility
# Runs weekly and on-demand to detect broken modules
name: Check Module Compatibility

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger with custom foundation version
    inputs:
      foundation_version:
        description: 'Foundation version to check against (e.g., 0.5.0)'
        required: false
        default: 'latest'

jobs:
  check-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml packaging

      - name: Determine foundation version
        id: foundation_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.foundation_version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.foundation_version }}"
          else
            # Fetch latest amplifier-foundation release from GitHub API
            VERSION=$(curl -s https://api.github.com/repos/microsoft/amplifier-foundation/releases/latest | jq -r .tag_name | sed 's/^v//')
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              # Fallback if API call fails
              VERSION="0.1.0"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Checking compatibility with foundation version: $VERSION"

      - name: Run compatibility check
        id: check
        run: |
          python scripts/check_compat.py \
            --foundation-version "${{ steps.foundation_version.outputs.version }}" \
            --output registry/broken-modules.json \
            --json > check-results.json || true

          # Extract results
          BROKEN_COUNT=$(jq -r '.broken' check-results.json)
          echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT

          # Display results
          cat check-results.json | jq .

      - name: Update module status
        if: steps.check.outputs.broken_count > 0
        run: |
          python scripts/check_compat.py \
            --foundation-version "${{ steps.foundation_version.outputs.version }}" \
            --update-status

      - name: Create issues for broken modules
        if: steps.check.outputs.broken_count > 0
        run: |
          # Read broken modules
          BROKEN_MODULES=$(jq -r '.broken_modules[] | @json' check-results.json)

          # Create issue for each broken module
          echo "$BROKEN_MODULES" | while IFS= read -r module_json; do
            MODULE_NAME=$(echo "$module_json" | jq -r '.module')
            REASON=$(echo "$module_json" | jq -r '.reason')
            SEVERITY=$(echo "$module_json" | jq -r '.severity')

            # Check if issue already exists
            EXISTING=$(gh issue list --search "in:title [Broken Module] $MODULE_NAME" --state open --json number --jq '.[0].number')

            if [ -z "$EXISTING" ]; then
              # Create new issue
              gh issue create \
                --title "[Broken Module] $MODULE_NAME incompatible with foundation ${{ steps.foundation_version.outputs.version }}" \
                --label "broken-module,$SEVERITY" \
                --body "## Module Compatibility Issue

          **Module**: \`$MODULE_NAME\`
          **Foundation Version**: \`${{ steps.foundation_version.outputs.version }}\`
          **Severity**: \`$SEVERITY\`

          ### Issue

          \`\`\`
          $REASON
          \`\`\`

          ### Action Required

          This module is incompatible with the current version of amplifier-foundation.

          **For module maintainers:**
          1. Update your module to work with foundation \`${{ steps.foundation_version.outputs.version }}\`
          2. Test thoroughly
          3. Update the \`foundation_version\` constraint in your manifest
          4. Comment on this issue when fixed

          **Timeline:**
          - You have **30 days** to resolve this issue
          - After 30 days, the module will be moved to \`archived\` status
          - Users will be warned when attempting to install

          ### Resources

          - [Foundation Changelog](https://github.com/microsoft/amplifier-foundation/releases)
          - [Migration Guide](https://docs.amplifier.dev/migration)
          - [Module Development Guide](https://docs.amplifier.dev/modules)

          ---
          This issue was created automatically by the compatibility checker.
          " \
                --assignee "" || echo "Failed to create issue for $MODULE_NAME"
            else
              echo "Issue already exists for $MODULE_NAME (#$EXISTING)"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit status updates
        if: steps.check.outputs.broken_count > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add broken modules report
          git add registry/broken-modules.json

          # Add updated manifests
          git add registry/modules/*/manifest.yaml || true
          git add registry/verified/*/manifest.yaml || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update module compatibility status

          Foundation version: ${{ steps.foundation_version.outputs.version }}
          Broken modules: ${{ steps.check.outputs.broken_count }}

          [skip ci]"
            git push
          fi

      - name: Summary comment
        run: |
          echo "## Compatibility Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Foundation Version**: \`${{ steps.foundation_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Broken Modules**: ${{ steps.check.outputs.broken_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.broken_count }}" -gt "0" ]; then
            echo "### Broken Modules" >> $GITHUB_STEP_SUMMARY
            jq -r '.broken_modules[] | "- **\(.module)**: \(.reason)"' check-results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All modules are compatible!" >> $GITHUB_STEP_SUMMARY
          fi
