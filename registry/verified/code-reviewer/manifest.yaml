name: code-reviewer
version: 1.0.0
description: Automated code review agent that analyzes code quality, style, and potential issues

author:
  name: Amplifier Team
  email: amplifier@microsoft.com
  github: microsoft

module_type: agent
entry_point: code_reviewer.agent:CodeReviewerAgent

repository:
  type: git
  url: https://github.com/microsoft/amplifier-code-reviewer
  branch: main

foundation_version: ">=0.1.0"
python_version: ">=3.10"

dependencies:
  python:
    - astroid>=3.0.0
    - pylint>=3.0.0

capabilities:
  - code-analysis
  - style-checking
  - best-practices

tags:
  - code-quality
  - automation
  - review
  - linting

license: MIT
homepage: https://github.com/microsoft/amplifier-code-reviewer#readme

keywords:
  - code-review
  - static-analysis
  - quality

status: active
verified: true
